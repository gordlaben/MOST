services:
  most:
    image: gordlaben/most:latest
    container_name: most
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      # You can pass these from a .env file or uncomment and set them here
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}
      # Set this to your public URL (e.g. https://most.yourdomain.com) to fix logo/redirect links
      - APP_URL=${APP_URL}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      - ENABLE_REGISTRATION=${ENABLE_REGISTRATION:-true}
    volumes:
      # Map a local data directory to persist the database
      - ./data:/app/data
    restart: unless-stopped
